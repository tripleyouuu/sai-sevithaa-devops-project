apiVersion: apps/v1
kind: Deployment
metadata:
  name: syllabus-backend-misconfigured
  namespace: syllabus
  labels:
    lab: broken-readiness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syllabus-backend-misconfigured
  template:
    metadata:
      labels:
        app: syllabus-backend-misconfigured
    spec:
      containers:
        - name: backend
          image: ghcr.io/tripleyouuu/syllabus-backend:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://syllabus:wrong-password@syllabus-postgres:5432/syllabus
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
