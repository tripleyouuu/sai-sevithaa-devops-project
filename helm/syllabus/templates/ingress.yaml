{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "syllabus.fullname" . }}
  labels:
    {{- include "syllabus.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "syllabus.backendName" . }}
                port:
                  name: http
          - path: /docs
            pathType: Exact
            backend:
              service:
                name: {{ include "syllabus.backendName" . }}
                port:
                  name: http
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ include "syllabus.backendName" . }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "syllabus.frontendName" . }}
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
