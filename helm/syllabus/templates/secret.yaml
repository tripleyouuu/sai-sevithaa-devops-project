apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syllabus.secretName" . }}
  labels:
    {{- include "syllabus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username .Values.postgres.password (include "syllabus.postgresName" .) .Values.postgres.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "externalDatabase.url is required when postgres.enabled=false" .Values.externalDatabase.url | quote }}
  {{- end }}
