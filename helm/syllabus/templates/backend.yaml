apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syllabus.backendName" . }}
  labels:
    {{- include "syllabus.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "syllabus.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "syllabus.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.backend.port }}", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: APP_VERSION
              value: {{ .Values.backend.image.tag | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.backend.corsOrigins | quote }}
          envFrom:
            - secretRef:
                name: {{ include "syllabus.secretName" . }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "syllabus.backendName" . }}
  labels:
    {{- include "syllabus.labels" . | nindent 4 }}
    {{- include "syllabus.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "syllabus.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
