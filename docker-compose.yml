services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syllabus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syllabus}
      POSTGRES_DB: ${POSTGRES_DB:-syllabus}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-syllabus}:${POSTGRES_PASSWORD:-syllabus}@postgres:5432/${POSTGRES_DB:-syllabus}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      APP_VERSION: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
